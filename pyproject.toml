[project]
name = "issue-metrics"
version = "1.0.0"
description = "GitHub Action that measures metrics for GitHub issues, pull requests, and discussions."
requires-python = ">=3.11"
dependencies = [
    "PyGithub==2.9.1",
    "numpy==2.4.6",
    "python-dotenv==1.2.4",
    "pytz==2026.6",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "mypy-extensions==1.2.0",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "types-pytz==2026.6.0.20261031",
]
